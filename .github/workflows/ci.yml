name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rust tests
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: The backend builds for WebAssembly
        run: cargo build -p nsh-miniprogram --target wasm32-unknown-unknown --release
      - name: Runtime tests
        run: node --test 'runtime/test/*.test.js'
      - name: Install NSH nightly
        run: |
          mkdir -p "$RUNNER_TEMP/nsh"
          curl -fsSL https://github.com/longbridge/nsh/releases/download/nightly/nsh-linux-x86_64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP/nsh"
          echo "$(dirname "$(find "$RUNNER_TEMP/nsh" -type f -name nsh | head -n1)")" >> "$GITHUB_PATH"
      - name: Package the counter with the platform nshm
        run: |
          nsh --version
          # A Git pin of NSH must name the revision the nsh CLI is built from.
          commit=$(curl -fsSL https://github.com/longbridge/nsh/releases/download/nightly/nsh-release.json | jq -r .commit)
          cargo update --manifest-path examples/counter/Cargo.toml -p nsh-core --precise "$commit"
          nsh package examples/counter --target miniprogram --out "$RUNNER_TEMP/mp-counter"
      - name: Run the packaged module through the runtime
        run: NSH_MP_PROJECT="$RUNNER_TEMP/mp-counter" node --test 'runtime/test/*.test.js'
