# The platform as an nshm: `nsh add github:huacnlee/nsh-platform-miniprogram`
# puts it in an app's `nsh.json`, and `nsh <command> --target miniprogram`
# builds this crate's binary `nsh-platform-miniprogram` and runs it
# (`nsh.json` here says `"platform": "miniprogram"`).
[package]
name = "nsh-platform-miniprogram"
description = "A community-maintained NSH platform nshm: runs Native Shell apps in WeChat Mini Programs (`--target miniprogram`)."
# A literal version: `nsh` reads it from here as the nshm's version.
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "nsh-platform-miniprogram"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
brotli.workspace = true
serde_json.workspace = true

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/huacnlee/nsh-platform-miniprogram"

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "deny"

# NSH nightly: its crates from longbridge/nsh's main, which the nightly
# `nsh` is built from. The platform follows NSH's protocol (mount items, the
# text engine, events) as it changes there.
[workspace.dependencies]
nsh-core = { git = "https://github.com/longbridge/nsh", branch = "main" }
nsh-engine = { git = "https://github.com/longbridge/nsh", branch = "main", default-features = false }
anyhow = "1"
brotli = "8"
log = "0.4"
serde_json = "1"
